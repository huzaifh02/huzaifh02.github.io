<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6573"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc84"/></marker>
  </defs>
  <rect width="960" height="440" fill="#0a0d12"/>

  <text x="30" y="36" fill="#8b95a3" font-size="12" letter-spacing="2">BEFORE</text>
  <text x="640" y="36" fill="#3ddc84" font-size="12" letter-spacing="2">AFTER</text>

  <rect x="30" y="60" width="200" height="110" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="130" y="92" fill="#e8edf2" font-size="13" text-anchor="middle">AWS ECS</text>
  <text x="130" y="114" fill="#8b95a3" font-size="10" text-anchor="middle">task defs + scripts</text>
  <text x="130" y="130" fill="#8b95a3" font-size="10" text-anchor="middle">per-service conventions</text>

  <rect x="30" y="200" width="200" height="110" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="130" y="232" fill="#e8edf2" font-size="13" text-anchor="middle">GCP Cloud Run</text>
  <text x="130" y="254" fill="#8b95a3" font-size="10" text-anchor="middle">separate deploy path</text>
  <text x="130" y="270" fill="#8b95a3" font-size="10" text-anchor="middle">no node-level control</text>

  <!-- cutover -->
  <rect x="300" y="60" width="270" height="250" rx="10" fill="#0d1117" stroke="#f5b942" stroke-dasharray="6 4"/>
  <text x="435" y="86" fill="#f5b942" font-size="11" letter-spacing="2" text-anchor="middle">STAGED CUTOVER</text>
  <g font-size="11" fill="#e8edf2">
    <text x="320" y="120">1. deploy to k8s alongside</text>
    <text x="320" y="150">2. validate health, metrics, logs</text>
    <text x="320" y="180">3. shift traffic per service</text>
    <text x="320" y="210">4. keep old deploy warm</text>
    <text x="320" y="240" fill="#f5b942">   rollback = point traffic back</text>
    <text x="320" y="280">5. decommission</text>
  </g>

  <rect x="640" y="60" width="290" height="250" rx="10" fill="rgba(61,220,132,0.06)" stroke="#3ddc84"/>
  <rect x="660" y="80" width="120" height="60" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="720" y="108" fill="#e8edf2" font-size="13" text-anchor="middle">EKS</text>
  <text x="720" y="126" fill="#8b95a3" font-size="10" text-anchor="middle">IRSA + KMS</text>
  <rect x="790" y="80" width="120" height="60" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="850" y="108" fill="#e8edf2" font-size="13" text-anchor="middle">GKE</text>
  <text x="850" y="126" fill="#8b95a3" font-size="10" text-anchor="middle">Workload Identity</text>
  <g font-size="10" fill="#8b95a3">
    <text x="660" y="172">node pools + taints</text>
    <text x="660" y="192">KEDA autoscaling</text>
    <text x="660" y="212">Prometheus / Grafana / Alertmanager</text>
    <text x="660" y="232">Helm chart per service</text>
    <text x="660" y="252">Terraform modules</text>
  </g>
  <text x="785" y="290" fill="#3ddc84" font-size="11" text-anchor="middle">0 customer-visible downtime</text>

  <g stroke-width="1.5" fill="none">
    <line x1="230" y1="115" x2="298" y2="140" stroke="#5b6573" marker-end="url(#a)"/>
    <line x1="230" y1="255" x2="298" y2="230" stroke="#5b6573" marker-end="url(#a)"/>
    <line x1="570" y1="185" x2="638" y2="185" stroke="#3ddc84" marker-end="url(#g)"/>
  </g>

  <!-- gitops -->
  <rect x="300" y="350" width="630" height="60" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="320" y="376" fill="#e8edf2" font-size="12">protected Git repo: Helm / Helmfile values</text>
  <text x="320" y="396" fill="#8b95a3" font-size="10">reconciled to dev, staging, prod. Drift corrected, not discovered.</text>
  <line x1="785" y1="350" x2="785" y2="312" stroke="#3ddc84" stroke-width="1.5" marker-end="url(#g)"/>
</svg>
