<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6573"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc84"/></marker>
  </defs>
  <rect width="960" height="440" fill="#0a0d12"/>

  <rect x="30" y="170" width="120" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="90" y="200" fill="#e8edf2" font-size="13" text-anchor="middle">Slack</text>
  <text x="90" y="220" fill="#8b95a3" font-size="11" text-anchor="middle">@-mention</text>

  <!-- deterministic layer -->
  <rect x="190" y="40" width="560" height="360" rx="10" fill="#0d1117" stroke="#3ddc84" stroke-dasharray="6 4"/>
  <text x="210" y="66" fill="#3ddc84" font-size="11" letter-spacing="2">DETERMINISTIC LAYER (TESTED CODE)</text>

  <rect x="215" y="170" width="130" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="280" y="198" fill="#e8edf2" font-size="12" text-anchor="middle">access gate</text>
  <text x="280" y="218" fill="#8b95a3" font-size="10" text-anchor="middle">channel allow-list</text>
  <text x="280" y="232" fill="#8b95a3" font-size="10" text-anchor="middle">user deny-list</text>

  <rect x="380" y="150" width="180" height="110" rx="6" fill="rgba(61,220,132,0.08)" stroke="#3ddc84"/>
  <text x="470" y="180" fill="#e8edf2" font-size="13" text-anchor="middle">model</text>
  <text x="470" y="200" fill="#8b95a3" font-size="10" text-anchor="middle">Claude Agent SDK</text>
  <text x="470" y="218" fill="#8b95a3" font-size="10" text-anchor="middle">router: Sonnet / Opus</text>
  <text x="470" y="236" fill="#8b95a3" font-size="10" text-anchor="middle">budgets, turn caps</text>

  <rect x="595" y="150" width="135" height="110" rx="6" fill="#131922" stroke="#f5b942"/>
  <text x="662" y="180" fill="#f5b942" font-size="12" text-anchor="middle">command guard</text>
  <text x="662" y="200" fill="#8b95a3" font-size="10" text-anchor="middle">split + unwrap</text>
  <text x="662" y="216" fill="#8b95a3" font-size="10" text-anchor="middle">bash -c, $(), ``</text>
  <text x="662" y="236" fill="#e8edf2" font-size="11" text-anchor="middle">unit tested</text>

  <rect x="215" y="300" width="250" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="340" y="328" fill="#e8edf2" font-size="12" text-anchor="middle">infra repo clone + playbooks</text>
  <text x="340" y="348" fill="#8b95a3" font-size="10" text-anchor="middle">git pull every 30 min, no RAG</text>

  <rect x="495" y="300" width="235" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="612" y="328" fill="#e8edf2" font-size="12" text-anchor="middle">audit log + transcripts</text>
  <text x="612" y="348" fill="#8b95a3" font-size="10" text-anchor="middle">append-only, per-thread sessions</text>

  <rect x="790" y="110" width="140" height="80" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="860" y="140" fill="#e8edf2" font-size="12" text-anchor="middle">AWS / GCP</text>
  <text x="860" y="160" fill="#8b95a3" font-size="10" text-anchor="middle">read-only role</text>
  <text x="860" y="175" fill="#8b95a3" font-size="10" text-anchor="middle">deny secrets/data</text>

  <rect x="790" y="220" width="140" height="80" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="860" y="250" fill="#e8edf2" font-size="12" text-anchor="middle">federated identity</text>
  <text x="860" y="270" fill="#8b95a3" font-size="10" text-anchor="middle">no static keys</text>
  <text x="860" y="285" fill="#8b95a3" font-size="10" text-anchor="middle">on the host</text>

  <g stroke-width="1.5" fill="none">
    <line x1="150" y1="205" x2="213" y2="205" stroke="#5b6573" marker-end="url(#a)"/>
    <line x1="345" y1="205" x2="378" y2="205" stroke="#5b6573" marker-end="url(#a)"/>
    <line x1="560" y1="205" x2="593" y2="205" stroke="#5b6573" marker-end="url(#a)"/>
    <path d="M730 180 L 788 150" stroke="#3ddc84" marker-end="url(#g)"/>
    <path d="M730 230 L 788 258" stroke="#3ddc84" marker-end="url(#g)"/>
    <line x1="430" y1="260" x2="380" y2="298" stroke="#5b6573" marker-end="url(#a)"/>
    <line x1="520" y1="260" x2="570" y2="298" stroke="#5b6573" marker-end="url(#a)"/>
  </g>
  <text x="470" y="100" fill="#8b95a3" font-size="11" text-anchor="middle">logs, files, tool output = data, never instructions</text>
