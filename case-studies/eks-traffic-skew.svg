<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6573"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3ddc84"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b942"/></marker>
  </defs>
  <rect width="960" height="440" fill="#0a0d12"/>

  <text x="30" y="36" fill="#f5b942" font-size="12" letter-spacing="2">BEFORE: L4 ROUTING + KEEP-ALIVE</text>
  <text x="510" y="36" fill="#3ddc84" font-size="12" letter-spacing="2">AFTER: L7 PER-REQUEST ROUTING</text>
  <line x1="480" y1="20" x2="480" y2="420" stroke="#1e2631"/>

  <!-- before -->
  <rect x="30" y="70" width="130" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="95" y="98" fill="#e8edf2" font-size="13" text-anchor="middle">client</text>
  <text x="95" y="118" fill="#8b95a3" font-size="11" text-anchor="middle">2 persistent conns</text>

  <rect x="30" y="200" width="130" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="95" y="228" fill="#e8edf2" font-size="13" text-anchor="middle">kube-proxy</text>
  <text x="95" y="248" fill="#8b95a3" font-size="11" text-anchor="middle">iptables, per SYN</text>
  <line x1="95" y1="140" x2="95" y2="198" stroke="#5b6573" stroke-width="1.5" marker-end="url(#a)"/>

  <g font-size="11">
    <rect x="250" y="70" width="190" height="44" rx="6" fill="rgba(245,185,66,0.12)" stroke="#f5b942"/>
    <text x="264" y="97" fill="#f5b942">pod-1  HOT  112m CPU</text>
    <rect x="250" y="128" width="190" height="36" rx="6" fill="#131922" stroke="#1e2631"/>
    <text x="264" y="151" fill="#5b6573">pod-2  idle  0.1m</text>
    <rect x="250" y="176" width="190" height="36" rx="6" fill="#131922" stroke="#1e2631"/>
    <text x="264" y="199" fill="#5b6573">pod-3  idle  0.1m</text>
    <rect x="250" y="224" width="190" height="36" rx="6" fill="#131922" stroke="#1e2631"/>
    <text x="264" y="247" fill="#5b6573">pod-4  idle  0.1m</text>
    <rect x="250" y="272" width="190" height="36" rx="6" fill="#131922" stroke="#1e2631"/>
    <text x="264" y="295" fill="#5b6573">pod-5  idle  0.1m</text>
  </g>
  <path d="M160 225 C 210 225, 200 92, 248 92" fill="none" stroke="#f5b942" stroke-width="2" marker-end="url(#w)"/>

  <rect x="30" y="340" width="410" height="64" rx="6" fill="#0d1117" stroke="#1e2631" stroke-dasharray="4 4"/>
  <text x="46" y="366" fill="#8b95a3" font-size="11">HPA: avg CPU &gt; target  -&gt;  5 to 15 pods, new nodes</text>
  <text x="46" y="388" fill="#f5b942" font-size="11">10 new pods, 0 requests. Same pod still hot.</text>

  <!-- after -->
  <rect x="510" y="70" width="130" height="70" rx="6" fill="#131922" stroke="#2f3a48"/>
  <text x="575" y="98" fill="#e8edf2" font-size="13" text-anchor="middle">client</text>
  <text x="575" y="118" fill="#8b95a3" font-size="11" text-anchor="middle">HTTP/2, gRPC</text>

  <rect x="510" y="200" width="130" height="70" rx="6" fill="rgba(61,220,132,0.08)" stroke="#3ddc84"/>
  <text x="575" y="228" fill="#e8edf2" font-size="13" text-anchor="middle">Envoy / Gateway</text>
  <text x="575" y="248" fill="#8b95a3" font-size="11" text-anchor="middle">per-request RR</text>
  <line x1="575" y1="140" x2="575" y2="198" stroke="#5b6573" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="575" y="300" fill="#8b95a3" font-size="10" text-anchor="middle">headless Service</text>
  <text x="575" y="315" fill="#8b95a3" font-size="10" text-anchor="middle">clusterIP: None</text>

  <g font-size="11">
    <rect x="730" y="70" width="200" height="36" rx="6" fill="#131922" stroke="#2f3a48"/>
    <text x="744" y="93" fill="#e8edf2">pod-1  ~2,000 req</text>
    <rect x="730" y="118" width="200" height="36" rx="6" fill="#131922" stroke="#2f3a48"/>
    <text x="744" y="141" fill="#e8edf2">pod-2  ~2,000 req</text>
    <rect x="730" y="166" width="200" height="36" rx="6" fill="#131922" stroke="#2f3a48"/>
    <text x="744" y="189" fill="#e8edf2">pod-3  ~2,000 req</text>
    <rect x="730" y="214" width="200" height="36" rx="6" fill="#131922" stroke="#2f3a48"/>
    <text x="744" y="237" fill="#e8edf2">pod-4  ~2,000 req</text>
    <rect x="730" y="262" width="200" height="36" rx="6" fill="#131922" stroke="#2f3a48"/>
    <text x="744" y="285" fill="#e8edf2">pod-5  ~2,000 req</text>
  </g>
  <g stroke="#3ddc84" stroke-width="1.5" fill="none">
    <path d="M640 235 C 690 235, 680 88, 728 88" marker-end="url(#g)"/>
    <path d="M640 235 C 690 235, 680 136, 728 136" marker-end="url(#g)"/>
    <path d="M640 235 C 690 235, 680 184, 728 184" marker-end="url(#g)"/>
    <path d="M640 235 C 690 235, 680 232, 728 232" marker-end="url(#g)"/>
    <path d="M640 235 C 690 235, 680 280, 728 280" marker-end="url(#g)"/>
  </g>

  <rect x="510" y="340" width="420" height="64" rx="6" fill="#0d1117" stroke="#1e2631" stroke-dasharray="4 4"/>
  <text x="526" y="366" fill="#8b95a3" font-size="11">tier 1: recycle conns + jitter   tier 2: IPVS lc</text>
  <text x="526" y="388" fill="#3ddc84" font-size="11">tier 3: L7 routing, 2-5% CPU variance</text>
</svg>
